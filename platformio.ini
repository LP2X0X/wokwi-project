[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; TFT_eSPI is configured here via build flags (NOT via the bundled
; User_Setup.h) so config lives with the project, not with the library
; install.
;
; Default target = ILI9341 (240x320) because that's what Wokwi's parts
; catalog ships. The renderer is driver-agnostic — to target ST7789
; (240x240) or GC9A01 (240x240 round IPS) on real hardware, change:
;     -DILI9341_DRIVER=1  -> -DST7789_DRIVER=1    (or -DGC9A01_DRIVER=1)
;     -DTFT_HEIGHT=320    -> -DTFT_HEIGHT=240
; No source code changes required.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; Shared SPI bus pins (ESP32-S3 FSPI defaults). All 3 displays share
    ; MOSI / SCLK / DC / RST / BL; per-display CS is managed manually in
    ; main.cpp by leaving TFT_CS=-1 here so the library does NOT toggle
    ; CS itself.
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=-1
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=15
    -DTFT_BACKLIGHT_ON=HIGH

    ; ESP32-S3 has no VSPI peripheral (TFT_eSPI's default on classic
    ; ESP32). Force HSPI so the SPI bus actually boots — without this
    ; tft.init() silently leaves the bus uninitialized and the first
    ; draw call dereferences a null transfer buffer (StoreProhibited
    ; @ EXCVADDR=0).
    -DUSE_HSPI_PORT=1

    ; 80 MHz cuts pushSprite from ~30 ms to ~15 ms per 240×240 frame, so
    ; the 3-display per-frame budget drops from ~90 ms (~10 fps, visibly
    ; choppy + ~60 ms stagger between displays) to ~45 ms (~20 fps,
    ; smoother + ~30 ms stagger). Drop to 40 MHz if your real-hardware
    ; breadboard wiring shows tearing or garbled pixels.
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000

    ; We don't draw any text — disable all fonts to save flash.
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=0

    -DDISABLE_ALL_LIBRARY_WARNINGS=1

    ; Route Arduino's Serial to the native USB-CDC port on ESP32-S3.
    ; Without this, Serial.println() writes to UART0 (GPIO43/44) and
    ; never reaches your USB cable — boot prints just disappear. Wokwi
    ; doesn't care (it emulates UART), but real hardware via the dev
    ; kit's USB-C port absolutely needs CDC_ON_BOOT.
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -DUSER_SETUP_INFO

; FSPI A/B — default ESP32-S3 port (no HSPI warning). Rebuild with
; -e esp32s3_fspi to compare push timing against HSPI baseline.
; NOTE: must inherit ${env:esp32s3.build_flags} explicitly — PlatformIO's
; `extends` does NOT auto-merge build_flags; without this the child env
; loses USER_SETUP_LOADED + pin defines + everything else and TFT_eSPI
; falls back to its bundled User_Setup.h (ILI9341 default).
[env:esp32s3_fspi]
extends = env:esp32s3
build_unflags =
    ${env:esp32s3.build_unflags}
    -DUSE_HSPI_PORT=1
build_flags =
    ${env:esp32s3.build_flags}
    -DUSE_FSPI_PORT=1

; Real-hardware build for the GC9A01 240×240 round IPS panel. The base
; esp32s3 env stays on ILI9341 because that's what the Wokwi sim has;
; use this env to flash an actual GC9A01 module:
;
;     pio run -e esp32s3_gc9a01 -t upload
;     pio device monitor -e esp32s3_gc9a01
;
; SPI is dialed down to 27 MHz for first-light reliability on hand-wired
; breadboards — real ESP32-S3 + short wires can do 60-80 MHz, but
; jumper-wire setups often need slower. Once the panel lights up, walk
; SPI_FREQUENCY back up (40 → 60 → 80) until you see corruption, then
; back off one step.
[env:esp32s3_gc9a01]
extends = env:esp32s3
build_unflags =
    ${env:esp32s3.build_unflags}
    -DILI9341_DRIVER=1
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=80000000
    -DTFT_CS=-1
build_flags =
    ${env:esp32s3.build_flags}
    -DGC9A01_DRIVER=1
    -DTFT_HEIGHT=240
    -DSPI_FREQUENCY=40000000
    ; Let the library drive the single CS line itself — no manual
    ; multi-display CS toggling on real hardware. The Wokwi env still
    ; uses TFT_CS=-1 for its three-panel CS-multiplex setup.
    -DTFT_CS=10
